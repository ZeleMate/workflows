# Advisories accepted for the CI tool lock next to this file.
# Semgrep pins these packages (mcp==1.29.0, opentelemetry-api~=1.37.0, wcmatch~=8.3), so
# they cannot be upgraded until Semgrep moves. The workflows only run `semgrep scan`, never
# Semgrep's MCP server or client, and nothing in the lock is shipped.
# Each entry expires, so the scan fails again and the ignore gets re-checked.

