name: security

on:
  workflow_call:
    inputs:
      sast:
        description: Run Semgrep. Off for public repos, where CodeQL default setup covers code scanning.
        type: boolean
        default: false

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  sast:
    name: sast (semgrep)
    if: inputs.sast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # This workflow's own repo at the SHA the caller pinned, for the hash-locked tools.
      # Moved out of the workspace so scanners and hooks never see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .central
          persist-credentials: false
      - run: mv .central "$RUNNER_TEMP/central"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # Semgrep Community Edition runs entirely in CI; no code leaves the runner except rule downloads.
      # Project rules under .semgrep/ in the caller are picked up automatically.
      - env:
          # semgrep-core can segfault in its io_uring backend on ubuntu-24.04
          # runners; Eio's portable backend avoids it.
          EIO_BACKEND: posix
        run: |
          configs=(--config p/default)
          [ -d .semgrep ] && configs+=(--config .semgrep)
          uv run --no-build --project "$RUNNER_TEMP/central/tools" semgrep scan "${configs[@]}" --error --metrics off --disable-version-check

  dependencies:
    name: dependencies (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_VERSION: "2.7.0"
      OSV_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Scan lockfiles
        run: |
          args=(scan source --recursive)
          # The eval harness lock has a non-standard name, so name it explicitly.
          [ -f evals/run.py.lock ] && args+=(--lockfile "uv.lock:evals/run.py.lock")
          "$RUNNER_TEMP/osv-scanner" "${args[@]}" .

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
