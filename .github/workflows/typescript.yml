name: typescript

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding package.json and pnpm-lock.yaml.
        type: string
        default: .
      node-version:
        description: Node.js version. Empty reads package.json (engines), which floats to the newest release a range allows.
        type: string
        default: ""

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # This workflow's own repo at the SHA the caller pinned, for the hash-locked tools.
      # Moved out of the workspace so scanners and hooks never see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .central
          persist-credentials: false
      - run: mv .central "$RUNNER_TEMP/central"
        working-directory: ${{ github.workspace }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.working-directory }}/package.json
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - name: Changed-line coverage ≥ 90%
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-build --project "$RUNNER_TEMP/central/tools" diff-cover coverage/cobertura-coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=90
      - run: pnpm run build
