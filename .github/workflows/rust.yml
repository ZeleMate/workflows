name: rust

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding Cargo.toml and rust-toolchain.toml.
        type: string
        default: .

permissions: {}

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install  # installs the rust-toolchain.toml pin
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2  # v2.90.0
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo nextest run --locked
      - run: cargo test --doc --locked
      - run: cargo deny check
