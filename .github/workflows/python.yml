name: python

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON list of Python minor versions to test, lowest first, e.g. '["3.13", "3.14"]'.
        type: string
        required: true
      type-checker:
        description: pyright or mypy.
        type: string
        default: pyright
      working-directory:
        description: Folder holding pyproject.toml and uv.lock.
        type: string
        default: .

permissions: {}

env:
  UV_LOCKED: "1"

jobs:
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # This workflow's own repo at the SHA the caller pinned, for the hash-locked tools.
      # Moved out of the workspace so scanners and hooks never see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .central
          persist-credentials: false
      - run: mv .central "$RUNNER_TEMP/central"
        working-directory: ${{ github.workspace }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "${{ inputs.working-directory }}/uv.lock"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - name: Type check
        env:
          TYPE_CHECKER: ${{ inputs.type-checker }}
        run: |
          case "$TYPE_CHECKER" in
            pyright|mypy) uv run "$TYPE_CHECKER" ;;
            *) echo "::error::type-checker must be pyright or mypy, got '$TYPE_CHECKER'"; exit 1 ;;
          esac
      - run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Changed-line coverage ≥ 90%
        if: github.event_name == 'pull_request' && matrix.python == fromJSON(inputs.python-versions)[0]
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-build --project "$RUNNER_TEMP/central/tools" diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=90
