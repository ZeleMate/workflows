version: 2
updates:
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
    commit-message:
      prefix: fix

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: fix
