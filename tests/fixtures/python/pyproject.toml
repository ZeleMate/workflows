[project]
name = "fixture"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fixture", email = "fixture@example.com" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "hypothesis>=6",
  "ruff>=0.15",
  "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# Supply-chain cooldown: ignore releases published in the last 7 days.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # flake8-bandit (security)
  "SIM", "C4", "PT", "N", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fixture"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
